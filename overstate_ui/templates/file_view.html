{% extends "base.html" %}
{% block title %}{{ rel }} — Overstate{% endblock %}
{% block content %}
<div class="max-w-4xl">
  <div class="flex flex-wrap items-center gap-2 mb-4">
    <a class="btn btn-sm btn-ghost" href="{{ url_for('files.index') }}">‹ Files</a>
    <h1 class="text-xl font-bold font-mono tracking-tight break-all">{{ rel }}</h1>
  </div>
  <p class="text-sm opacity-70 mb-4">Read-only{% if revision %}, synced from git at <code class="font-mono">{{ revision }}</code>{% endif %}.</p>
  <pre class="mockup-code overflow-x-auto border border-base-300 p-4"><code>{{ content }}</code></pre>
</div>
{% endblock %}
