{% extends "base.html" %}
{% block title %}Jobs · Overstate{% endblock %}
{% block content %}
<div class="flex flex-wrap items-end gap-3 mb-5">
  <div class="mr-auto">
    <h1 class="text-2xl font-bold tracking-tight">Jobs</h1>
    <p class="text-sm opacity-70 mt-0.5">Dispatch commands and inspect returns.</p>
  </div>
  <a class="btn btn-sm btn-primary" href="{{ url_for('jobs.new') }}" data-loading-link data-loading-text="Loading…">Run job</a>
  <a class="btn btn-sm btn-ghost" href="{{ url_for('jobs.orchestrate') }}">Orchestrate</a>
  <button id="live-toggle" class="btn btn-sm btn-ghost" title="Pauses auto-refresh on the job and minion lists" aria-label="Pause live updates on job and minion lists" aria-pressed="false">Pause live updates</button>
</div>
<form id="jobs-filter" method="get" action="{{ url_for('jobs.index') }}" hx-get="{{ url_for('jobs.index') }}" hx-target="#jobs-region" hx-swap="outerHTML" hx-push-url="true" hx-trigger="submit" class="card card-sm bg-base-100 border border-base-300 shadow-sm mb-4">
  <input type="hidden" name="tab" value="{{ tab }}">
  <input type="hidden" name="sort" value="{{ sort }}">
  <input type="hidden" name="dir" value="{{ direction }}">
  <div class="card-body flex-row flex-wrap items-end gap-2">
    <fieldset class="fieldset flex-1 min-w-48">
      <legend class="fieldset-legend">Search</legend>
      <input type="search" name="q" value="{{ q }}" placeholder="Search JID, function, target, user…" class="input input-sm">
    </fieldset>
    <fieldset class="fieldset min-w-48">
      <legend class="fieldset-legend">Jump to JID</legend>
      <input type="search" name="jump" value="" placeholder="Exact JID…" class="input input-sm font-mono">
    </fieldset>
    <button class="btn btn-sm btn-primary mb-1">Filter</button>
    {% if q %}<a class="btn btn-sm btn-ghost mb-1" href="{{ url_for('jobs.index', tab=tab, sort=sort, dir=direction) }}">Clear</a>{% endif %}
  </div>
</form>
{% include "_job_rows.html" %}
<script>
(function () {
  var btn = document.getElementById("live-toggle");
  // Shared pause key: job and minion lists only.
  var key = "overstate-live";
  function paused() {
    try { return localStorage.getItem(key) === "off"; }
    catch (e) { return false; }
  }
  function paint() { if (btn) { btn.textContent = paused() ? "Resume live updates" : "Pause live updates"; btn.setAttribute("aria-pressed", paused() ? "true" : "false"); } }
  if (btn) btn.addEventListener("click", function () {
    try { localStorage.setItem(key, paused() ? "on" : "off"); } catch (e) {}
    paint();
  });
  paint();
  // The filter form lives outside #jobs-region so polling never wipes
  // in-progress text; a slow index never overlaps the next poll.
  var inflight = false;
  function setRefreshing(on) {
    var el = document.getElementById("jobs-refreshing");
    if (!el) return;
    el.classList.toggle("hidden", !on);
    el.classList.toggle("inline-flex", on);
  }
  document.addEventListener("htmx:afterSwap", function () { inflight = false; setRefreshing(false); });
  document.addEventListener("htmx:responseError", function () { inflight = false; setRefreshing(false); });
  document.addEventListener("htmx:afterSwap", function () {
    var params = new URLSearchParams(location.search);
    var form = document.getElementById("jobs-filter");
    if (!form) return;
    ["tab", "sort", "dir"].forEach(function (name) {
      var value = params.get(name);
      if (value !== null) form.elements[name].value = value;
    });
  });
  setInterval(function () {
    if (paused() || document.hidden || !window.htmx || inflight) return;
    var region = document.getElementById("jobs-region");
    if (!region || !region.getAttribute("data-poll-url")) return;
    if (region.querySelector("input:focus, select:focus, textarea:focus")) return;
    inflight = true;
    setRefreshing(true);
    htmx.ajax("GET", region.getAttribute("data-poll-url"),
              {target: "#jobs-region", swap: "outerHTML"});
  }, 10000);
})();
</script>
{% endblock %}
