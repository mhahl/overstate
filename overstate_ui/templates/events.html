{% extends "base.html" %}
{% block title %}Events · Overstate{% endblock %}
{% block content %}
<div class="mb-5">
  <h1 class="text-2xl font-bold tracking-tight">Events</h1>
  <p class="text-sm opacity-70 mt-0.5">Live Salt event bus stream, newest first.</p>
</div>
<form method="get" class="card card-sm bg-base-100 border border-base-300 shadow-sm mb-4">
  <div class="card-body flex-row flex-wrap items-center gap-x-4 gap-y-2">
    {% for c in choices %}
    <label class="flex items-center gap-2 text-sm font-mono cursor-pointer">
      <input type="checkbox" name="tag" value="{{ c }}" class="checkbox checkbox-sm checkbox-primary"{% if c in selected %} checked{% endif %}> {{ c }}
    </label>
    {% endfor %}
    <button class="btn btn-sm btn-primary ml-auto">Watch</button>
  </div>
  <div class="card-body flex-row flex-wrap items-end gap-2 border-t border-base-200">
    <fieldset class="fieldset flex-1 min-w-48">
      <legend class="fieldset-legend">Search stream</legend>
      <input id="event-filter" type="search" placeholder="Filter shown events…" class="input input-sm" autocomplete="off" aria-describedby="event-count">
    </fieldset>
    <span id="event-count" class="text-xs opacity-70 pb-1" aria-label="Shown event count"></span>
  </div>
</form>
<div class="card bg-base-100 border border-base-300 shadow-sm">
  <div class="flex items-center gap-2 px-4 py-2 border-b border-base-200">
    <h2 class="text-sm font-medium mr-auto">Live stream</h2>
    <span id="event-status" class="badge badge-sm badge-ghost" role="status">connecting</span>
  </div>
  <ul id="event-list"></ul>
  <p id="event-note" class="px-4 py-3 text-sm opacity-70 border-t border-base-200" aria-live="polite">Connecting…</p>
</div>
<script>
(function () {
  var params = new URLSearchParams();
  {% for c in selected %}params.append("tag", {{ c|tojson }});{% endfor %}
  var src = new EventSource("{{ url_for('events.stream') }}?" + params.toString());
  var list = document.getElementById("event-list");
  var note = document.getElementById("event-note");
  var filterInput = document.getElementById("event-filter");
  var count = document.getElementById("event-count");
  var statusEl = document.getElementById("event-status");
  function setStatus(text, badge) {
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.className = "badge badge-sm " + badge;
  }
  function updateCount() {
    // Plain text, not live-announced: keystroke chatter would drown the
    // status line. Screen-reader users can navigate to it on demand.
    var shown = 0;
    Array.prototype.forEach.call(list.children, function (li) {
      if (!li.classList.contains("hidden")) shown += 1;
    });
    if (count) count.textContent = list.children.length ? (shown + " of " + list.children.length + " shown") : "";
  }
  function applyFilter() {
    var q = filterInput.value.toLowerCase();
    Array.prototype.forEach.call(list.children, function (li) {
      var text = li.textContent.toLowerCase();
      li.classList.toggle("hidden", !!q && text.indexOf(q) === -1);
    });
    updateCount();
  }
  filterInput.addEventListener("input", applyFilter);
  src.onopen = function () {
    setStatus("streaming", "badge-info");
    if (list.children.length === 0) {
      note.textContent = "Connected. Waiting for events. Run a job to see events.";
    }
  };
  src.onmessage = function (ev) {
    var s = JSON.parse(ev.data);
    var li = document.createElement("li");
    li.className = "flex items-center gap-2 px-4 py-2 border-b border-base-200 last:border-0 font-mono text-xs";
    var dot = document.createElement("span");
    dot.className = "status status-info shrink-0";
    dot.setAttribute("aria-hidden", "true");
    li.appendChild(dot);
    var text = document.createElement("span");
    text.className = "break-all";
    text.textContent = (s.stamp ? s.stamp + " " : "") + s.tag;
    li.appendChild(text);
    list.prepend(li);
    while (list.children.length > 50) list.removeChild(list.lastChild);
    applyFilter();
    note.textContent = "Streaming newest first, filtered on the server.";
  };
  var finished = false;
  function finish(msg, bad) {
    if (finished) return;
    finished = true;
    note.textContent = msg;
    setStatus(bad ? "error" : "ended", bad ? "badge-error" : "badge-neutral");
    src.close();
  }
  src.addEventListener("done", function () { finish("Stream ended. Re-watch to resume.", false); });
  src.addEventListener("error", function () { finish("Stream error or salt-api unreachable.", true); });
  src.onerror = function () {
    if (finished) return;
    finish("Stream error or salt-api unreachable.", true);
  };
})();
</script>
{% endblock %}
