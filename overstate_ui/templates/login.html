<!doctype html>
<html lang="en" data-theme="{{ app_theme|default('wireframe') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Overstate</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-base-200 min-h-screen">
<div class="min-h-screen grid place-items-center px-4 py-10">
  <div class="card bg-base-100 card-border shadow-xl w-full max-w-3xl overflow-hidden md:grid md:grid-cols-5">
    <div class="bg-primary text-primary-content p-8 md:col-span-2 flex flex-col justify-center gap-5">
      <div class="flex items-center gap-3">
        <img src="{{ url_for('static', filename='overstate.svg') }}" alt="Overstate" class="w-11 h-11">
        <div>
          <p class="font-bold text-2xl leading-none tracking-tight">Overstate</p>
          <p class="text-sm opacity-80 mt-1">Salt control plane</p>
        </div>
      </div>
      <p class="flex items-center gap-2.5 text-sm">
        <span class="icon-[lucide--cpu] size-4 shrink-0" aria-hidden="true"></span>
        Fleet inventory and presence.
      </p>
    </div>
    <form method="post" class="card-body md:col-span-3 gap-3 md:p-8">
      <h1 class="card-title text-lg">Log in</h1>
      {{ form.csrf_token }}
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, m in messages %}<div class="alert {{ 'alert-error' if category == 'error' else 'alert-info' }} mb-2" role="alert">{{ m }}</div>{% endfor %}
        {% endif %}
      {% endwith %}
      <label class="fieldset">
        <span class="fieldset-legend">Username</span>
        {{ form.username(class_="input w-full", autocomplete="username") }}
      </label>
      <label class="fieldset">
        <span class="fieldset-legend">Password</span>
        {{ form.password(class_="input w-full", autocomplete="current-password") }}
      </label>
      <div class="card-actions flex-col mt-1">
        <button class="btn btn-primary btn-block">Log in</button>
        {% if sso %}
        <div class="divider my-1">or</div>
        <a class="btn btn-outline btn-block" href="{{ url_for('auth.oidc_login') }}">
          <span class="icon-[lucide--key] size-4" aria-hidden="true"></span>
          Log in with SSO
        </a>
        {% endif %}
      </div>
    </form>
  </div>
</div>
</body>
</html>
