{% extends "base.html" %}
{% block title %}Confirm {{ fun }} — Overstate{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-bold tracking-tight mb-1">Confirm destructive action</h1>
  <p class="text-sm opacity-70 mb-4">This changes fleet state and cannot be undone from here.</p>
  <div class="alert alert-warning mb-4" role="alert">
    <span class="icon-[lucide--triangle-alert] size-5 shrink-0" aria-hidden="true"></span>
    <span><strong class="font-mono">{{ fun }}</strong> <span class="font-mono">{{ raw_args }}</span> will run on
      <strong class="font-mono">{{ tgt }}</strong> ({{ tgt_type }}).</span>
  </div>
  <form method="post" action="{{ url_for('jobs.run') }}" class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="tgt" value="{{ tgt }}">
      <input type="hidden" name="tgt_type" value="{{ tgt_type }}">
      <input type="hidden" name="fun" value="{{ fun }}">
      <input type="hidden" name="args" value="{{ raw_args }}">
      <input type="hidden" name="mode" value="{{ mode }}">
      <input type="hidden" name="via" value="{{ via }}">
      <input type="hidden" name="save_as" value="{{ save_as }}">
      <input type="hidden" name="batch_mode" value="{{ batch_mode | default('off') }}">
      <input type="hidden" name="batch_size" value="{{ batch_size | default(25) }}">
      <input type="hidden" name="stop_after" value="{{ stop_after | default(1) }}">
      <label class="form-control">
        <span class="label"><span class="label-text">Type <code>{{ tgt }}</code> to confirm</span></span>
        <input name="confirm" class="input input-bordered" autocomplete="off" autofocus>
      </label>
      <div class="card-actions justify-end mt-2">
        <a class="btn btn-ghost" href="{{ url_for('jobs.new') }}">Cancel</a>
        <button class="btn btn-warning">Run {{ fun }}</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
