<div class="mt-2 rounded-lg border border-base-300 bg-base-200/50 p-3">
  <p class="font-mono text-sm font-semibold">{{ fun }}</p>
  {% if doc %}
  <pre class="mt-1 text-xs font-mono whitespace-pre-wrap opacity-80">{{ doc }}</pre>
  {% else %}
  <p class="mt-1 text-xs opacity-70">No docs returned for {{ fun }}.</p>
  {% endif %}
</div>
