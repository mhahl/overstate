[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overstate-ui"
version = "0.1.0"
description = "Overstate: a Salt control-plane UI in front of salt-api"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2",
    "SQLAlchemy>=2.0",
    "Alembic>=1.14",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "rq>=1.16",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "Authlib>=1.3",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["overstate_ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.coverage.run]
source = ["overstate_ui"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == \"__main__\":",
    "raise AssertionError",
]
