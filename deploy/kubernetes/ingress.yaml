# Public HTTPS for the app. Traefik terminates TLS with the
# cert-manager certificate below; the app serves plain HTTP behind it
# (TRUST_PROXY=1 so CSRF origin checks see the external host).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: overstate-web-tls
spec:
  secretName: overstate-web-tls
  dnsNames:
    - overstate.sigaint.au
  issuerRef:
    name: le-production
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: overstate-web
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`overstate.sigaint.au`)
      kind: Rule
      services:
        - name: overstate-app
          port: 8000
  tls:
    secretName: overstate-web-tls
