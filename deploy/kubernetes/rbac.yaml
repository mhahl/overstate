# RBAC for the cloud-native direction: the app ServiceAccount may manage
# the master's ConfigMaps and restart the salt-master StatefulSet. All
# Role/RoleBinding — nothing cluster-scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overstate-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: overstate-app
rules:
  # Own the salt-master configuration (this ConfigMap + its history).
  # Name-scoped; no list/watch (collection reads cannot be name-scoped,
  # and the app only ever addresses these two objects). No delete: the
  # app must never be able to delete the live config. `create` stays so
  # a missing history ConfigMap self-heals on first save.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["salt-master-config", "salt-master-config-history"]
    verbs: ["get", "create", "update"]
  # Rollout-restart the salt-master StatefulSet (patch only, no delete).
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["salt-master"]
    verbs: ["get", "patch"]
  # Read sibling workloads and diagnostics.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: overstate-app
subjects:
  - kind: ServiceAccount
    name: overstate-app
roleRef:
  kind: Role
  name: overstate-app
  apiGroup: rbac.authorization.k8s.io
---
# Peer self-healing for the salt-master entrypoint: read-only,
# namespace-scoped discovery of cluster members. The entrypoint
# prefers the EndpointSlice member list over DNS, prunes dead peer
# keys only on a provably complete view, and bounces stalled joins.
# No secrets, configmaps, pods, or writes of any kind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: salt-master
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: salt-master-peers
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [salt-master]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: salt-master-peers
subjects:
  - kind: ServiceAccount
    name: salt-master
roleRef:
  kind: Role
  name: salt-master-peers
  apiGroup: rbac.authorization.k8s.io
