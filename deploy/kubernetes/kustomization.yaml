# Overstate on Kubernetes (production).
#
# Everything here is namespace-scoped to `overstate`: no ClusterRoles,
# no StorageClasses, no edits outside the namespace. Apply with:
#
#   kubectl apply -k deploy/kubernetes
#
# Secrets are NOT committed. Create them before the first apply
# (docs/install-kubernetes.md §1, §4, §6) or salt-master pods stay
# CreateContainerConfigError:
#
#   overstate-secrets
#   salt-master-keys            (master.pem / master.pub)
#   salt-master-cluster         (cluster.conf with cluster_secret)
#   salt-master-cluster-keys    (cluster.pem / cluster.pub)
#   salt-master-db              (returner.conf; optional until job cache)
#
# The app/worker image is set via the `images:` transformer below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: overstate

labels:
  - pairs:
      app.kubernetes.io/part-of: overstate
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - rbac.yaml
  - salt-master-config.yaml
  - salt-master-config-history.yaml
  - salt-seed.yaml
  - volumes.yaml
  - redis.yaml
  - postgres.yaml
  - salt-master.yaml
  - app.yaml
  - worker.yaml
  - reconcile-cronjob.yaml
  - ingress.yaml
  - salt-mq-routes.yaml

images:
  # App/worker image (Quay). Bump newTag per release; the Deployment
  # base name `overstate-app` must keep matching `name:` here.
  - name: overstate-app
    newName: quay.io/sigaint/overstate
    newTag: pair11
