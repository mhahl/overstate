# Salt master + salt-api (project image: stock :lts plus the postgres
# driver for the shared job cache). Three-node cluster (isolated
# filesystem). Minion 4505/4506 is per-node (Traefik hostPort +
# salt-master-mq internalTrafficPolicy: Local): a connection to a
# node's public IP only reaches the master on that node. Same keypair
# (owner-held `salt-master-keys` Secret, never committed), one
# ConfigMap, cluster credential from the owner-held
# `salt-master-cluster` Secret (never committed), pinned cluster.pem/pub
# from owner-held `salt-master-cluster-keys` (never committed). Rolling
# restarts go one pod at a time, so quorum (2 of 3) always serves.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: salt-master
spec:
  serviceName: salt-master
  replicas: 3
  # Sequential bootstrap (and rolling updates): a pod only starts
  # joining after its predecessor is Ready, so key exchange never
  # runs against two half-started peers at once. Never Parallel.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: salt-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: salt-master
    spec:
      # fsGroup 1000 (salt): the Secret-mounted keypair is root-owned, so
      # the group bit is what lets the daemon read it. Must stay in sync
      # with the image's salt uid/gid.
      securityContext:
        fsGroup: 1000
      # Dedicated identity for the entrypoint's peer self-healing (API
      # discovery of EndpointSlices, read-only; see
      # salt-master-peers Role). Never the default ServiceAccount.
      serviceAccountName: salt-master
      # The three are only three on different nodes: never schedule two
      # masters onto one hostname, or one node loss kills quorum.
      affinity:
        # No node allow-list: ordinals float and the Longhorn RWO keys
        # PVC follows its pod. The only placement rule is one master
        # per hostname, so one node loss never kills quorum. Per-node
        # minion MQ assumes exactly three nodes (see salt-master-mq).
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: salt-master
              topologyKey: kubernetes.io/hostname
      containers:
        - name: salt-master
          # TODO: pin to a digest for reproducibility (same TODO as
          # Containerfile.salt-master in the repo).
          # Own repo (not the app repo): quay.io/sigaint/overstate
          # holds app images only; master images live in
          # quay.io/sigaint/overstate-salt-master.
          image: quay.io/sigaint/overstate-salt-master:lts-pg14
          # Floating tag redeploys (entrypoint fixes) must actually pull.
          imagePullPolicy: Always
          env:
            # Pod name and IP for cluster identity (see
            # cluster-entrypoint.sh): interface is stamped from the
            # pod IP, id/cluster_node_id/peers from the stable pod
            # DNS name (<POD_NAME>.<headless-svc>).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SALT_API_ENABLED
              value: "True"
            - name: SALT_API_USER
              value: overstate
            - name: SALT_API_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: overstate-secrets
                  key: SALT_API_USER_PASS
            - name: SALT_MINION_ENABLED
              value: "False"
          ports:
            - name: publish
              containerPort: 4505
            - name: request
              containerPort: 4506
            - name: api
              containerPort: 8000
            - name: cluster
              containerPort: 4507
          volumeMounts:
            # Owned configuration (ConfigMap salt-master-config).
            - name: config
              mountPath: /home/salt/data/config
              readOnly: true
            # Shared file roots, served read-only (app holds the writer).
            - name: srv
              mountPath: /home/salt/data/srv
              readOnly: true
            # Cluster key store (per-pod PVC): cluster_pki_dir lives here,
            # so accepted keys survive reschedules. A fresh pod rejoins
            # via cluster_secret + cluster_peers and pulls keys in-band.
            - name: keys
              mountPath: /home/salt/data/keys
            # Shared master identity: the same keypair on all three pods, from
            # the owner-held `salt-master-keys` Secret (see
            # docs/install-kubernetes.md). subPath file mounts leave the
            # rest of the keys dir (accepted minions) on the PVC.
            - name: master-keypair
              mountPath: /home/salt/data/keys/master.pem
              subPath: master.pem
              readOnly: true
            - name: master-keypair
              mountPath: /home/salt/data/keys/master.pub
              subPath: master.pub
              readOnly: true
            # Pinned cluster identity (docs/install-kubernetes.md §6):
            # owner-held Secret salt-master-cluster-keys with keys
            # cluster.pem and cluster.pub. The entrypoint copies them
            # onto the PVC before salt-master starts so a pod cannot
            # mint its own pair. Generate with openssl genrsa +
            # -RSAPublicKey_out, or copy from a live founder. Not a
            # subPath onto _cluster/ (Salt may rewrite those files).
            - name: cluster-keypair
              mountPath: /home/salt/data/cluster-keys
              readOnly: true
            # (The returner drop-in arrives via the projected `config`
            # volume below — never a subPath file mount into this
            # read-only directory: these nodes reject that with ENOTDIR.)
          # Ready means a Raft leader is visible AND salt-api is
          # accepting: the watcher touches .cluster_ready only after
          # cluster.members shows a leader this node belongs to, and
          # deletes it at every wrapper start. Peer .pub files existing
          # is not enough (that was true with voter_count 0). TCP 8000
          # is the serving check (no curl in the image). Until both
          # hold, the pod stays out of the MQ/API Services.
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - test -f /home/salt/data/keys/.cluster_ready && exec 3<>/dev/tcp/127.0.0.1/8000 && exec 4<>/dev/tcp/$POD_IP/4507
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          # Dead daemon, wedged supervisor: kubelet restarts the pod
          # into a clean rejoin. Process-existence only (never health):
          # a clustered-but-uncommitted master is alive and must NOT
          # be restarted for it. The entrypoint's rate-limited
          # recovery still owns the wedged-but-alive cases.
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - supervisorctl status salt-master 2>/dev/null | grep -q '^salt-master *RUNNING'
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
      volumes:
        # One directory from three sources: the owned ConfigMap plus the
        # owner-held returner and cluster Secrets. Projected (not subPath
        # overlays): file mounts into a read-only ConfigMap mount fail on
        # these nodes. The UI keeps editing the ConfigMap object itself;
        # the Secrets never appear there.
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: salt-master-config
              - secret:
                  name: salt-master-db
              - secret:
                  name: salt-master-cluster
        - name: master-keypair
          secret:
            secretName: salt-master-keys
            defaultMode: 0440
        - name: cluster-keypair
          secret:
            # Required. Create before apply — see install §6.2–6.3.
            # Keys must be named cluster.pem and cluster.pub.
            secretName: salt-master-cluster-keys
            defaultMode: 0440
            items:
              - key: cluster.pem
                path: cluster.pem
              - key: cluster.pub
                path: cluster.pub
        - name: srv
          persistentVolumeClaim:
            claimName: srv-data
  volumeClaimTemplates:
    - metadata:
        name: keys
      spec:
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Headless service: StatefulSet identity, plus Raft peer traffic for
# the master cluster. publishNotReadyAddresses is load-bearing: peer
# discovery (API + DNS) must see every pod's stable DNS name before
# it is Ready, or the election set can never agree on a founder
# (chicken-and-egg). Traefik uses the sibling Services, so this
# changes nothing on the minion path.
apiVersion: v1
kind: Service
metadata:
  name: salt-master
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: salt-master
  ports:
    - name: publish
      port: 4505
    - name: request
      port: 4506
    - name: api
      port: 8000
    - name: cluster
      port: 4507
---
# salt-api for the app (in-cluster HTTPS; the image mints its own cert —
# see SALT_API_VERIFY_CA=false on the app with a follow-up to pin it).
# ClientIP affinity: eauth tokens live on the minting pod, so clients
# must stick to one master instead of round-robining into 401s.
apiVersion: v1
kind: Service
metadata:
  name: salt-master-api
spec:
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/name: salt-master
  ports:
    - name: api
      port: 8000
      targetPort: api
---
# ZeroMQ publish/request for minions. Traefik on each node (hostPort
# 4505/4506) targets this Service. internalTrafficPolicy: Local so
# kube-proxy on that node only has the local master as an endpoint —
# salt-c010 / salt-42e5 / salt-b2b6 each stick to one pod. Traefik
# must nativeLB the ClusterIP (see salt-mq-routes.yaml) or it dials
# pod IPs and ignores this. ClientIP affinity is a backstop.
apiVersion: v1
kind: Service
metadata:
  name: salt-master-mq
spec:
  internalTrafficPolicy: Local
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 86400
  selector:
    app.kubernetes.io/name: salt-master
  ports:
    - name: publish
      port: 4505
      targetPort: publish
    - name: request
      port: 4506
      targetPort: request
---
# Voluntary disruptions (node drains, upgrades) must always leave quorum
# (2 of 3) up: Raft loses its leader without two voters. Minions ride
# out the drain on the survivors.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: salt-master
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: salt-master
