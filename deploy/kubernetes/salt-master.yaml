# Salt master + salt-api (project image: stock :lts plus the postgres
# driver for the shared job cache). Clustered pair (isolated
# filesystem): both pods share one AES session key and one accepted-keys
# store, so the Traefik TCP round-robin in front of 4505/4506 is the
# supported topology. Same keypair (owner-held `salt-master-keys`
# Secret, never committed), one ConfigMap, cluster credential from the
# owner-held `salt-master-cluster` Secret (never committed). Rolling
# restarts go one pod at a time, so one master always serves.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: salt-master
spec:
  serviceName: salt-master
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: salt-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: salt-master
    spec:
      # fsGroup 1000 (salt): the Secret-mounted keypair is root-owned, so
      # the group bit is what lets the daemon read it. Must stay in sync
      # with the image's salt uid/gid.
      securityContext:
        fsGroup: 1000
      # The pair is only a pair on different nodes: never schedule both
      # masters onto one hostname, or one node loss kills the failover.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: salt-master
              topologyKey: kubernetes.io/hostname
      containers:
        - name: salt-master
          # TODO: pin to a digest for reproducibility (same TODO as
          # Containerfile.salt-master in the repo).
          # Own repo (not the app repo): quay.io/sigaint/overstate
          # holds app images only; master images live in
          # quay.io/sigaint/overstate-salt-master.
          image: quay.io/sigaint/overstate-salt-master:lts-pg8
          env:
            # Pod name and IP for cluster identity (see
            # cluster-entrypoint.sh): interface/id/peers are stamped
            # from the pod IP at boot.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SALT_API_ENABLED
              value: "True"
            - name: SALT_API_USER
              value: overstate
            - name: SALT_API_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: overstate-secrets
                  key: SALT_API_USER_PASS
            - name: SALT_MINION_ENABLED
              value: "False"
          ports:
            - name: publish
              containerPort: 4505
            - name: request
              containerPort: 4506
            - name: api
              containerPort: 8000
            - name: cluster
              containerPort: 4507
          volumeMounts:
            # Owned configuration (ConfigMap salt-master-config).
            - name: config
              mountPath: /home/salt/data/config
              readOnly: true
            # Shared file roots, served read-only (app holds the writer).
            - name: srv
              mountPath: /home/salt/data/srv
              readOnly: true
            # Cluster key store (per-pod PVC): cluster_pki_dir lives here,
            # so accepted keys survive reschedules. A fresh pod rejoins
            # via cluster_secret + cluster_peers and pulls keys in-band.
            - name: keys
              mountPath: /home/salt/data/keys
            # Shared master identity: the same keypair on both pods, from
            # the owner-held `salt-master-keys` Secret (see
            # docs/install-kubernetes.md). subPath file mounts leave the
            # rest of the keys dir (accepted minions) on the PVC.
            - name: master-keypair
              mountPath: /home/salt/data/keys/master.pem
              subPath: master.pem
              readOnly: true
            - name: master-keypair
              mountPath: /home/salt/data/keys/master.pub
              subPath: master.pub
              readOnly: true
            # (The returner drop-in arrives via the projected `config`
            # volume below — never a subPath file mount into this
            # read-only directory: these nodes reject that with ENOTDIR.)
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
      volumes:
        # One directory from three sources: the owned ConfigMap plus the
        # owner-held returner and cluster Secrets. Projected (not subPath
        # overlays): file mounts into a read-only ConfigMap mount fail on
        # these nodes. The UI keeps editing the ConfigMap object itself;
        # the Secrets never appear there.
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: salt-master-config
              - secret:
                  name: salt-master-db
              - secret:
                  name: salt-master-cluster
        - name: master-keypair
          secret:
            secretName: salt-master-keys
            defaultMode: 0440
        - name: srv
          persistentVolumeClaim:
            claimName: srv-data
  volumeClaimTemplates:
    - metadata:
        name: keys
      spec:
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Headless service: StatefulSet identity, plus Raft peer traffic for
# the master cluster. publishNotReadyAddresses is load-bearing: each
# pod binds `interface` to its own DNS name at boot, before it is
# Ready, so the name must resolve pre-readiness or the daemon can
# never bind (chicken-and-egg). Traefik uses the sibling Services,
# so this changes nothing on the minion path.
apiVersion: v1
kind: Service
metadata:
  name: salt-master
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: salt-master
  ports:
    - name: publish
      port: 4505
    - name: request
      port: 4506
    - name: api
      port: 8000
    - name: cluster
      port: 4507
---
# salt-api for the app (in-cluster HTTPS; the image mints its own cert —
# see SALT_API_VERIFY_CA=false on the app with a follow-up to pin it).
apiVersion: v1
kind: Service
metadata:
  name: salt-master-api
spec:
  selector:
    app.kubernetes.io/name: salt-master
  ports:
    - name: api
      port: 8000
      targetPort: api
---
# ZeroMQ publish/request for minions. Traefik routes (salt-mq-routes.yaml)
# target this service once the 4505/4506 entrypoints exist.
apiVersion: v1
kind: Service
metadata:
  name: salt-master-mq
spec:
  selector:
    app.kubernetes.io/name: salt-master
  ports:
    - name: publish
      port: 4505
      targetPort: publish
    - name: request
      port: 4506
      targetPort: request
---
# Voluntary disruptions (node drains, upgrades) must always leave one
# master up: minions ride out the drain on the survivor.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: salt-master
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: salt-master
