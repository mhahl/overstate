# ZeroMQ publish/request for minions (4505/4506) through Traefik.
#
# REQUIRES entrypoints `salt-publish` (4505) and `salt-request` (4506)
# on Traefik's static config — that lives in the `traefik` namespace,
# outside this boundary. Raw ZeroMQ carries no SNI, so each router
# catch-alls its own entrypoint.
#
# nativeLB: true — Traefik dials the Service ClusterIP so kube-proxy
# honours salt-master-mq internalTrafficPolicy: Local (per-node pin).
# Without it Traefik load-balances to all pod IPs and Local is a no-op.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: salt-publish
spec:
  entryPoints:
    - salt-publish
  routes:
    - match: HostSNI(`*`)
      services:
        - name: salt-master-mq
          port: 4505
          nativeLB: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: salt-request
spec:
  entryPoints:
    - salt-request
  routes:
    - match: HostSNI(`*`)
      services:
        - name: salt-master-mq
          port: 4506
          nativeLB: true
