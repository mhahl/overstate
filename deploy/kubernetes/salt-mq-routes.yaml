# ZeroMQ publish/request for minions (4505/4506) through Traefik.
#
# REQUIRES entrypoints `salt-publish` (4505) and `salt-request` (4506)
# on Traefik's static config — that lives in the `traefik` namespace,
# outside this boundary, so these routes stay detached until those
# entrypoints are approved and added. Applying them early is inert:
# Traefik ignores routes whose entrypoints do not exist. Raw ZeroMQ
# carries no SNI, so each router catch-alls its own entrypoint (same
# shape as the cluster's adguard-dot precedent).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: salt-publish
spec:
  entryPoints:
    - salt-publish
  routes:
    - match: HostSNI(`*`)
      services:
        - name: salt-master-mq
          port: 4505
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: salt-request
spec:
  entryPoints:
    - salt-request
  routes:
    - match: HostSNI(`*`)
      services:
        - name: salt-master-mq
          port: 4506
