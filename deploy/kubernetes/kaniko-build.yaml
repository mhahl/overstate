# Kaniko in-cluster build for the app/worker image.
#
# Applied ad hoc (NOT part of the kustomization `resources:` list) —
# see docs/guides/install-kubernetes.md §2 for the release flow:
#
#   TAG=<short sha of the CODE commit being shipped — same sha the
#        kustomization newTag pins; capture it BEFORE the pin commit>
#   git archive --format=tar.gz -o /tmp/overstate-context.tar.gz $TAG
#   sed "s/__TAG__/${TAG}/" deploy/kubernetes/kaniko-build.yaml | kubectl apply -f -
#   kubectl -n overstate wait --for=condition=ready pod/context-loader --timeout=120s
#   kubectl cp /tmp/overstate-context.tar.gz overstate/context-loader:/context/context.tar.gz
#   kubectl -n overstate delete pod context-loader
#   kubectl -n overstate wait --for=condition=complete job/overstate-build --timeout=900s
#   kubectl -n overstate delete job overstate-build
#   kubectl -n overstate delete pvc build-context
#
# One apply only. `kubectl apply` of this file twice breaks the build
# (a second apply refuses the immutable Job pod-spec, and it re-creates
# the context-loader pod, whose RWO PVC mount then blocks the kaniko
# pod from attaching). The kaniko pod runs an await-context init
# container so it never starts before the tarball is on the PVC.
#
# The RWO race can flip: if the JOB pod wins the PVC attach first, the
# context-loader never becomes ready (Multi-Attach error). Recovery:
# do NOT delete the kaniko pod (with backoffLimit: 0 that fails the
# job) — instead delete the failed job, keep the PVC (the tarball is
# already on it, or re-copy), and apply only the Job document:
#
#   kubectl -n overstate delete job overstate-build
#   sed "s/__TAG__/${TAG}/" deploy/kubernetes/kaniko-build.yaml \
#     | awk 'BEGIN{p=0} /^kind: Job$/{p=1} p' | kubectl apply -f -
#   kubectl -n overstate wait --for=condition=complete job/overstate-build --timeout=900s
#
# The loader-free job finds the tarball already on the PVC and builds.
#
# The regcred secret (quay.io push credentials, kubernetes.io/dockerconfigjson
# type) is created once and survives between releases:
#
#   kubectl create secret docker-registry regcred -n overstate \
#     --docker-server=quay.io --docker-username=<user> --docker-password=<token>
#
# No local Linux container runtime is required: builds run entirely inside
# the cluster, so a FreeBSD/arm64 workstation works unchanged.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-context
  namespace: overstate
spec:
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: context-loader
  namespace: overstate
spec:
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: ctx
          mountPath: /context
  volumes:
    - name: ctx
      persistentVolumeClaim:
        claimName: build-context
  restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: overstate-build
  namespace: overstate
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: overstate
        app.kubernetes.io/component: image-build
    spec:
      restartPolicy: Never
      initContainers:
        # The context-loader pod feeds the tarball onto the shared PVC;
        # the kaniko pod may attach first (RWO attach ordering is racy),
        # so wait for the tarball instead of starting blind.
        - name: await-context
          image: busybox:1.36
          command:
            - sh
            - -c
            - "while [ ! -f /context/context.tar.gz ]; do sleep 2; done"
          volumeMounts:
            - name: ctx
              mountPath: /context
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - "--context=tar:///context/context.tar.gz"
            - "--dockerfile=Containerfile"
            - "--destination=quay.io/sigaint/overstate:__TAG__"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: ctx
              mountPath: /context
            - name: docker-config
              mountPath: /kaniko/.docker
      volumes:
        - name: ctx
          persistentVolumeClaim:
            claimName: build-context
        - name: docker-config
          secret:
            secretName: regcred
            items:
              - key: .dockerconfigjson
                path: config.json