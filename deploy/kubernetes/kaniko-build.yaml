# Kaniko in-cluster build for the app/worker image.
#
# Applied ad hoc (NOT part of the kustomization `resources:` list) —
# see docs/guides/install-kubernetes.md §2 for the release flow:
#
#   TAG=$(git rev-parse --short HEAD)
#   git archive --format=tar.gz -o /tmp/overstate-context.tar.gz HEAD
#   kubectl apply -f deploy/kubernetes/kaniko-build.yaml
#   kubectl -n overstate wait --for=condition=ready pod/context-loader --timeout=120s
#   kubectl cp /tmp/overstate-context.tar.gz overstate/context-loader:/context/context.tar.gz
#   kubectl -n overstate delete pod context-loader
#   sed "s/__TAG__/${TAG}/" deploy/kubernetes/kaniko-build.yaml | kubectl apply -f -
#   kubectl -n overstate wait --for=condition=complete job/overstate-build --timeout=900s
#   kubectl -n overstate delete job overstate-build
#   kubectl -n overstate delete pvc build-context
#
# The regcred secret (quay.io push credentials, kubernetes.io/dockerconfigjson
# type) is created once and survives between releases:
#
#   kubectl create secret docker-registry regcred -n overstate \
#     --docker-server=quay.io --docker-username=<user> --docker-password=<token>
#
# No local Linux container runtime is required: builds run entirely inside
# the cluster, so a FreeBSD/arm64 workstation works unchanged.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-context
  namespace: overstate
spec:
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: context-loader
  namespace: overstate
spec:
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: ctx
          mountPath: /context
  volumes:
    - name: ctx
      persistentVolumeClaim:
        claimName: build-context
  restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: overstate-build
  namespace: overstate
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: overstate
        app.kubernetes.io/component: image-build
    spec:
      restartPolicy: Never
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - "--context=tar:///context/context.tar.gz"
            - "--dockerfile=Containerfile"
            - "--destination=quay.io/sigaint/overstate:__TAG__"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: ctx
              mountPath: /context
            - name: docker-config
              mountPath: /kaniko/.docker
      volumes:
        - name: ctx
          persistentVolumeClaim:
            claimName: build-context
        - name: docker-config
          secret:
            secretName: regcred
            items:
              - key: .dockerconfigjson
                path: config.json