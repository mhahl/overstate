# Salt master configuration, owned by Overstate.
#
# This ConfigMap IS the master's config surface: edit it (by hand here,
# later through the app's Master Config page) and restart the
# salt-master StatefulSet to apply. Mounted at /home/salt/data/config,
# which the master image reads as config drop-ins.
#
# The eauth user itself is created by the image from SALT_API_USER /
# SALT_API_USER_PASS env (see salt-master.yaml); the password never
# lives in this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: salt-master-config
data:
  # Main overrides. Image defaults cover file roots and pillar; keep
  # this file minimal — every key here beats an image default.
  master.conf: |
    # Managed by Overstate. Add master overrides below this line.
    # Salt master cluster (isolated filesystem): all three pods share one
    # AES session key and one accepted-keys store, so the Traefik TCP
    # round-robin in front of 4505/4506 is the supported topology.
    # Per-pod identity (interface = pod IP, id/cluster_node_id/peers =
    # DNS names) is a writable drop-in on the keys PVC, included below.
    # Static peers CANNOT live in this file (drop-ins beat the stamp).
    # cluster_secret arrives as cluster.conf from the owner-held
    # salt-master-cluster Secret (never in this file, never in the UI).
    include:
      - /home/salt/data/keys/cluster-identity.conf
    cluster_id: overstate-masters
    cluster_port: 4507
    cluster_pki_dir: /home/salt/data/keys/_cluster
    cluster_isolated_filesystem: true
    # localfs_key (not mmap_key): mmap's master_keys bank was empty on
    # each PVC, so each pod generated its own cluster.pub for minion
    # auth. Traefik then flipped minions between three keys and they
    # logged "The master key has changed" even after deleting
    # minion_master.pub. On-disk cluster.pem is already identical.
    keys.cache_driver: localfs_key
    # Raft timing for cross-node Kubernetes: the defaults (0.75-1.5 s
    # follower timeout against 50-100 ms beacons) assume loop delays
    # stay in the tens of ms. Our two voters phase-locked into a
    # ~1 Hz duel of spurious elections (terms in the thousands, no
    # leader holds long enough to commit), so followers tolerate
    # multi-second beacon gaps instead. Failover detection moves to
    # 3-6 s — fine for minions, which ride out blips on TCP.
    cluster_election_min: 3000
    cluster_election_max: 6000
  # salt-api auth for the `overstate` eauth user. Mirrors
  # salt-config/api.conf from the repo (grants the app needs, nothing
  # more). TLS for salt-api is the image's own self-signed cert (see
  # the NOTE below, kept from the repo file).
  api.conf: |
    external_auth:
      pam:
        overstate:
          - test.ping
          - pkg.install
          - pkg.remove
          - service.restart
          - service.status
          - ps.kill_pid
          - mine.update
          - mine.*
          - state.apply
          - state.highstate
          - saltutil.kill_job
          - state.show_highstate
          - state.show_sls
          - schedule.list
          - schedule.add
          - schedule.enable_job
          - schedule.disable_job
          - schedule.delete
          - beacons.list
          - beacons.enable_beacon
          - beacons.disable_beacon
          - saltutil.sync_all
          - saltutil.refresh_pillar
          - grains.items
          - pillar.items
          - sys.*
          - "@wheel"
          - "@runner"
          - "@jobs"
    netapi_enable_clients:
      - local
      - local_async
      - ssh
      - runner
      - wheel
    # NOTE: the master image appends its own rest_cherrypy block (with a
    # fresh self-signed cert) to the main config file at every boot, and
    # the main file beats this include for nested keys — so ssl_crt /
    # ssl_key here would be ignored.
