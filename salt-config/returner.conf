# Dev-only: persist every job return into Overstate's Postgres via the
# stock pgjsonb returner (grill decision D1). Tables jids/salt_returns are
# created by the app (create_all) and versioned in Alembic; the master only
# writes. Never point a real master at a UI database without review.
#
# Note: on the master job-cache path Salt resolves returner options by
# literal dotted key, so these must stay flat (returner.pgjsonb.host),
# not a nested returner: pgjsonb: mapping.
#
# Only master_job_cache is set. ext_job_cache handles publish-time loads
# only and actively disables return storage, so it must stay unset.
master_job_cache: pgjsonb

returner.pgjsonb.host: postgres
returner.pgjsonb.port: 5432
returner.pgjsonb.db: overstate
returner.pgjsonb.user: overstate
returner.pgjsonb.pass: overstate
