# Dev-only salt-api auth for the `overstate` eauth user (grill decision D3).
# The system user itself is created by the salt-master image from
# SALT_API_USER / SALT_API_USER_PASS.
external_auth:
  pam:
    overstate:
      - test.ping
      - pkg.install
      - pkg.remove
      - service.restart
      - service.status
      - ps.kill_pid
      - mine.update
      - mine.*
      - state.apply
      - state.highstate
      - saltutil.kill_job
      - state.show_highstate
      - state.show_sls
      - schedule.*
      - beacons.list
      - beacons.enable_beacon
      - beacons.disable_beacon
      - saltutil.sync_all
      - saltutil.refresh_pillar
      - grains.items
      - pillar.items
      - sys.*
      - "@wheel"
      - "@runner"
      - "@jobs"

netapi_enable_clients:
  - local
  - local_async
  - ssh

# NOTE: the master image appends its own rest_cherrypy block (with a fresh
# self-signed cert) to the main config file at every boot, and the main
# file beats this include for nested keys — so ssl_crt/ssl_key here would
# be ignored. Our CA-signed certs are installed over the image's paths by
# scripts/enable-api-tls.sh instead (see docs/tls.md).
  - runner
  - wheel
